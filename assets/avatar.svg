<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-label="Cartoon avatar of Nithish at a laptop">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#8B5CF6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C98B62"/>
      <stop offset="1" stop-color="#B57650"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2233"/>
      <stop offset="1" stop-color="#120E18"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD6EE"/>
    </linearGradient>
    <linearGradient id="laptop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2145"/>
      <stop offset="1" stop-color="#17112A"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .float1{animation:f 4s ease-in-out infinite}
      .float2{animation:f 4.6s ease-in-out .8s infinite}
      .float3{animation:f 5.2s ease-in-out 1.4s infinite}
      .float4{animation:f 4.3s ease-in-out 2s infinite}
      @keyframes f{50%{transform:translateY(-8px)}}
      .eyes{animation:blink 5s infinite; transform-origin:200px 196px}
      @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
      .screen{animation:glow 3s ease-in-out infinite}
      @keyframes glow{50%{opacity:.6}}
      @media (prefers-reduced-motion: reduce){ .float1,.float2,.float3,.float4,.eyes,.screen{animation:none} }
    </style>
  </defs>

  <!-- glow -->
  <circle cx="200" cy="210" r="190" fill="url(#bgGlow)"/>

  <!-- shoulders / shirt -->
  <path d="M70 440 C72 360 110 318 165 304 L235 304 C290 318 328 360 330 440 Z" fill="url(#shirt)"/>
  <!-- collar -->
  <path d="M168 300 L200 340 L184 352 L156 314 Z" fill="#FFFFFF" stroke="#CFC8E6" stroke-width="2"/>
  <path d="M232 300 L200 340 L216 352 L244 314 Z" fill="#FFFFFF" stroke="#CFC8E6" stroke-width="2"/>
  <path d="M200 340 L200 440" stroke="#CFC8E6" stroke-width="2"/>
  <circle cx="200" cy="372" r="3.5" fill="#8E87A8"/>
  <circle cx="200" cy="410" r="3.5" fill="#8E87A8"/>

  <!-- neck -->
  <path d="M176 262 L176 302 L200 338 L224 302 L224 262 Z" fill="#B06F4A"/>

  <!-- ears -->
  <ellipse cx="136" cy="200" rx="13" ry="20" fill="url(#skin)"/>
  <ellipse cx="264" cy="200" rx="13" ry="20" fill="url(#skin)"/>

  <!-- face -->
  <path d="M140 160 C140 110 260 110 260 160 L260 215 C260 262 232 290 200 290 C168 290 140 262 140 215 Z" fill="url(#skin)"/>

  <!-- beard shadow + goatee -->
  <path d="M146 222 C152 262 176 286 200 288 C224 286 248 262 254 222 C246 252 228 270 200 272 C172 270 154 252 146 222 Z" fill="#3A2C2A" opacity=".35"/>
  <path d="M186 258 C190 282 210 282 214 258 C208 266 192 266 186 258 Z" fill="#2A2026"/>

  <!-- hair: faded short sides, tall swept-up quiff -->
  <path d="M138 196 C132 166 136 140 150 124 L156 160 C150 170 144 182 138 196 Z" fill="#2A2233" opacity=".85"/>
  <path d="M262 196 C268 166 264 140 250 124 L244 160 C250 170 256 182 262 196 Z" fill="#2A2233" opacity=".85"/>
  <path d="M146 150 C138 112 156 78 196 66 C226 58 262 70 272 98 C278 116 268 136 256 148 C250 138 238 134 222 136 C200 138 174 140 160 146 C154 148 150 150 146 150 Z" fill="url(#hair)"/>
  <path d="M164 104 C182 80 220 70 252 82 C236 84 210 90 192 102 C182 108 172 108 164 104 Z" fill="#4A3F58"/>
  <path d="M176 124 C196 108 228 104 252 112" stroke="#4A3F58" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- eyebrows -->
  <path d="M158 176 C170 168 184 168 192 174" stroke="#1C1520" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M208 174 C216 168 230 168 242 176" stroke="#1C1520" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- eyes -->
  <g class="eyes">
    <ellipse cx="176" cy="196" rx="11" ry="8" fill="#FFFFFF"/>
    <ellipse cx="224" cy="196" rx="11" ry="8" fill="#FFFFFF"/>
    <circle cx="177" cy="197" r="6" fill="#2A1C14"/>
    <circle cx="225" cy="197" r="6" fill="#2A1C14"/>
    <circle cx="179" cy="195" r="2" fill="#FFFFFF"/>
    <circle cx="227" cy="195" r="2" fill="#FFFFFF"/>
  </g>

  <!-- nose -->
  <path d="M200 204 C198 218 192 226 196 230 C200 232 206 230 208 228" stroke="#94593A" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- moustache + smile -->
  <path d="M174 244 C184 234 196 236 200 240 C204 236 216 234 226 244 C214 242 206 246 200 246 C194 246 186 242 174 244 Z" fill="#241A20"/>
  <path d="M184 252 C192 258 208 258 216 252" stroke="#7A3E2C" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- laptop -->
  <g>
    <path d="M86 330 L314 330 L330 440 L70 440 Z" fill="url(#laptop)" stroke="#5B4A8C" stroke-width="2"/>
    <rect class="screen" x="150" y="360" width="100" height="56" rx="10" fill="#8B5CF6" opacity=".35" filter="url(#soft)"/>
    <text x="200" y="398" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#C4B5FD">&lt;/&gt;</text>
  </g>

  <!-- floating skill badges -->
  <g class="float1">
    <rect x="18" y="96" width="70" height="44" rx="12" fill="#1B1530" stroke="#8B5CF6" stroke-width="2"/>
    <text x="53" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#C4B5FD">API</text>
  </g>
  <g class="float2">
    <rect x="312" y="84" width="70" height="44" rx="12" fill="#1B1530" stroke="#22D3C5" stroke-width="2"/>
    <path d="M347 94 L333 99 V108 C333 116 339 121 347 124 C355 121 361 116 361 108 V99 Z" fill="none" stroke="#22D3C5" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g class="float3">
    <rect x="14" y="236" width="70" height="44" rx="12" fill="#1B1530" stroke="#60A5FA" stroke-width="2"/>
    <path d="M36 268 H62 A8 8 0 0 0 61 252 A11 11 0 0 0 40 250 A9 9 0 0 0 36 268 Z" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <g class="float4">
    <rect x="316" y="226" width="70" height="44" rx="12" fill="#1B1530" stroke="#FBBF24" stroke-width="2"/>
    <text x="351" y="254" text-anchor="middle" font-family="Consolas, monospace" font-size="17" font-weight="700" fill="#FBBF24">AI</text>
  </g>
</svg>
